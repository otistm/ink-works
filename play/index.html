<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ink Works</title>
<meta name="description" content="Build it. Launch it. Get trophies.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ink Works">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,800;1,9..144,900&family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
<!-- ?v= matches VERSION in js/config.js: bump it with every change so browsers fetch the new files -->
<link rel="stylesheet" href="styles.css?v=0.12.0">
<link rel="stylesheet" href="game.css?v=0.12.0">
</head>
<body>
<canvas id="c" aria-label="Workbench"></canvas>
<header id="top" hidden>
  <div><div class="hn" id="hn">First roll</div><div class="sub" id="hsub"></div></div>
  <div class="pts"><div class="pv" id="costbox"><span id="cost">0</span></div><div class="pv" id="live" hidden><span id="livev">0</span><small id="liveu">m</small></div><div class="sub" id="budget"></div></div>
  <div id="marks"></div>
</header>
<div id="trail" aria-hidden="true"></div>
<div id="dock" hidden>
  <div id="warn" role="status"></div>
  <div id="budgetbox" aria-live="polite">
    <div class="bl"><b id="left">70</b><span>left to spend</span></div>
    <div class="bar" id="bbar"></div>
    <small id="bspent">0 of 70 spent</small>
  </div>
  <div class="txt"><div id="power" role="status"></div><div id="info"></div></div>
  <div class="acts"><button class="btn ghost" id="clear" type="button">Clear</button><button class="btn" id="launch" type="button">Launch</button></div>
</div>
<div id="hint" hidden><span id="hintT"></span></div>
<button id="skip" type="button" hidden>Skip to the result</button>
<div id="callout"></div>
<div id="card" hidden><div class="panel" id="panel"></div></div>
<div id="report" hidden>
  <button id="bRetry" class="pbtn main" type="button">Run it again</button>
  <button id="bAgain" class="pbtn" type="button">Change the build</button>
  <small id="reportKeys">Space to run again · Esc to change the build</small>
</div>
<div id="reportSay" class="sr" role="status" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="js/config.js?v=0.12.0"></script>
<script src="js/engine.js?v=0.12.0"></script>
<script src="js/audio.js?v=0.12.0"></script>
<script src="js/ink.js?v=0.12.0"></script>
<script src="js/world.js?v=0.12.0"></script>
<script src="js/power.js?v=0.12.0"></script>
<script src="js/game.js?v=0.12.0"></script>
<script src="js/report.js?v=0.12.0"></script>
<script src="js/main.js?v=0.12.0"></script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('/sw.js').catch(()=>{});</script>
</body>
</html>
